[tool.poetry]
name = "smart-app-framework"
version = "0.0.0"
description = "Python-фреймворк, который позволяет создавать смартапы для виртуальных ассистентов Салют."
authors = ["Salute Developers <developer@sberdevices.ru>"]
readme = "README.md"
packages = [
    {include = "core"},
    {include = "scenarios"},
    {include = "smart_kit"},
    {include = "nlpf_statemachine"},
]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux"
]


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
aiohttp = ">3.10.5"
boto = ">=2.49.0,<3"
cachetools = ">=5.3.0,<6"
croniter = ">=1.3.7,<2"
dill = ">=0.3.6,<0.4"
ics = ">=0.7.3,<0.8"
Jinja2 = ">=3.1.6,<4"
keras = {version = ">=2.12.0,<2.13", python = "<3.12", optional = true}
nltk = ">=3.10.3,<4"
# TensorFlow 2.12 requires NumPy <1.24; newer Python versions use NumPy 2.x.
numpy = [
    {version = ">=1.23.5,<1.24", python = "<3.12"},
    {version = ">=2.5.1,<3", python = ">=3.12,<3.15"},
]
objgraph = ">=3.4.1,<4"
prometheus-client = ">=0.11.0,<0.12"
psutil = ">=5.9.4,<6"
pyignite = ">=0.6.1,<0.7"
pymorphy2 = ">=0.8,<0.9"
pymorphy2_dicts = ">=2.4.393442.3710985,<3"
python-dateutil = ">=2.7.3,<3"
python-json-logger = ">=0.1.11,<0.2"
PyYAML = ">=6.0.1,<7"
requests = ">=2.32.2"
rusenttokenize = ">=0.0.5,<0.1"
six = {version = ">=1.16.0", python = ">=3.12"}
# Keep the existing model-serialization compatibility within each minor release.
scikit-learn = [
    {version = ">=1.1.2,<1.2", python = "<3.11", optional = true},
    {version = ">=1.2.0,<1.3", python = "3.11.*", optional = true},
]
setuptools = ">75.2.0"
tabulate = ">=0.9.0,<0.10"
tensorflow = [
    {version = ">=2.12.0,<2.13", markers = "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.12'", optional = true},
    {version = ">=2.12.0,<2.13", markers = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.12'", optional = true},
]
tensorflow-macos = {version = ">=2.12.0,<2.13", markers = "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.12'", optional = true}
tensorflow-aarch64 = {version = ">=2.12.0,<2.13", markers = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version < '3.12'", optional = true}
timeout-decorator = ">=0.4.1,<0.5"
tqdm = ">=4.66.3"
freezegun = [
    {version = ">=1.1.0,<2", python = "<3.13"},
    {version = ">=1.5.5,<2", python = ">=3.13,<3.15"},
]
lxml = [
    {version = ">=4.9.2,<5", python = "<3.12"},
    {version = ">=6.1.1,<7", python = ">=3.12,<3.15"},
]
twisted = ">=24.11.0,<25"
urllib3 = ">=2.0.0"
certifi = ">=2024.7.4"
aiokafka = ">=0.14.0,<0.15"
# TatSu 5.13 supports the full Python 3.10–3.14 range.
TatSu = ">=5.13.2,<5.14"
python-decouple = ">=3.4,<4"
lazy = ">=1.5,<2"
kafka-python = ">=3.0.11,<4"
pydantic = ">=2.13.5,<3"

[tool.poetry.extras]
ml = ["keras", "scikit-learn", "tensorflow", "tensorflow-macos", "tensorflow-aarch64"]

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3.0,<8"
taskipy = ">=1.10.3,<2"
black = ">=22.12.0,<23"

[tool.taskipy.tasks]
lint = "flake8 . --max-line-length=120 --ignore W504,W605,F401,E123 --exclude=smart_kit/utils/SmartAppToMessage_pb2.py"
unit_test = "python -m unittest discover -b -v -s tests/pure_framework && python -m unittest discover -b -v -s tests/nlpf_statemachine_tests"
runapp_http_test = """python -m smart_kit create_app http_test_app &&
                      cd http_test_app &&
                      PYTHONPATH=".." timeout 10 python manage.py run_app || code=$?;
                      if [ $code -ne 124 ] && [ $code -ne 0 ]; then exit $code; fi"""
runapp_kafka_test = """docker compose -f .github/docker-compose.yml up -d &&
                       python -m smart_kit create_app kafka_test_app &&
                       cp .github/kafka_config.yml kafka_test_app/static/configs/kafka_config.yml &&
                       cp .github/logging_config.yml kafka_test_app/static/configs/logging_config.yml &&
                       cd kafka_test_app &&
                       echo 'from smart_kit.start_points.main_loop_kafka import MainLoop' >> app_config.py &&
                       echo 'MAIN_LOOP = MainLoop' >> app_config.py &&
                       sleep 5 &&
                       docker compose -f ../.github/docker-compose.yml exec -T kafka kafka-topics.sh --create --bootstrap-server localhost:9092 --partitions 3 --topic toTestApp &&
                       sleep 5 &&
                       PYTHONPATH=".." timeout 60 python manage.py run_app || code=$?;
                       if [ $code -ne 124 ] && [ $code -ne 0 ]; then exit $code; fi"""

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
